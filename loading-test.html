<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Utility with Loading 테스트</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/ajax-util.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        button { margin: 5px; padding: 8px 15px; cursor: pointer; }
        .loading-btn { background: #ffc107; color: #333; border: none; border-radius: 4px; }
        .custom-btn { background: #17a2b8; color: white; border: none; border-radius: 4px; }
        .no-loading-btn { background: #6c757d; color: white; border: none; border-radius: 4px; }
        
        /* 커스텀 로딩 스타일 */
        .custom-loading {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 25px;
            z-index: 10000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none;
        }
        
        .custom-loading::before {
            content: "⏳ ";
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <h1>HTTP Utility with Loading 기능 테스트</h1>
    
    <div class="test-section">
        <h2>1. 기본 내장 로딩 화면 테스트</h2>
        <p>기본적으로 로딩 화면이 자동으로 표시됩니다.</p>
        <button class="loading-btn" onclick="testDefaultLoading()">기본 로딩 테스트 (3초 지연)</button>
        <button class="loading-btn" onclick="testMultipleRequests()">다중 요청 테스트</button>
        <div class="result" id="default-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 커스텀 로딩 함수 테스트</h2>
        <p>사용자가 정의한 로딩 함수를 사용합니다.</p>
        <button class="custom-btn" onclick="testCustomLoading()">커스텀 로딩 테스트</button>
        <div class="result" id="custom-result"></div>
        <div class="custom-loading" id="custom-loading-indicator">커스텀 로딩중...</div>
    </div>
    
    <div class="test-section">
        <h2>3. 로딩 비활성화 테스트</h2>
        <p>로딩 화면을 표시하지 않습니다.</p>
        <button class="no-loading-btn" onclick="testNoLoading()">로딩 비활성화 테스트</button>
        <div class="result" id="no-loading-result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. 기존 JSP 코드 호환성 테스트</h2>
        <p>기존 loading/unloading 함수와의 호환성을 테스트합니다.</p>
        <button onclick="testJspCompatibility()">JSP 호환성 테스트</button>
        <div class="result" id="jsp-result"></div>
        <div id="jsp-loading-status" style="color: blue; font-weight: bold;"></div>
    </div>

    <script>
        // 가짜 API 응답을 시뮬레이션하는 함수
        function simulateApiDelay(ms = 2000) {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve({
                        status: 'success',
                        message: `${ms}ms 지연 후 응답`,
                        timestamp: new Date().toISOString()
                    });
                }, ms);
            });
        }
        
        // 1. 기본 내장 로딩 화면 테스트
        async function testDefaultLoading() {
            $('#default-result').text('요청 시작...');
            
            try {
                // 가짜 API 호출 (실제로는 $.http.post 사용)
                $('#default-result').text('로딩 화면이 표시되어야 합니다...');
                
                // 실제 API 대신 시뮬레이션
                await new Promise(resolve => {
                    $.http._defaultLoading();
                    setTimeout(() => {
                        $.http._defaultUnloading();
                        resolve();
                    }, 3000);
                });
                
                $('#default-result').text('기본 로딩 테스트 완료!\n로딩 화면이 3초간 표시되었습니다.');
                
            } catch (error) {
                $('#default-result').text('오류: ' + error.message);
            }
        }
        
        // 다중 요청 테스트
        async function testMultipleRequests() {
            $('#default-result').text('다중 요청 시작...');
            
            try {
                // 3개의 동시 요청 시뮬레이션
                const promises = [];
                
                for (let i = 1; i <= 3; i++) {
                    promises.push(new Promise(resolve => {
                        $.http._defaultLoading();
                        setTimeout(() => {
                            $.http._defaultUnloading();
                            resolve(`요청 ${i} 완료`);
                        }, 1000 + (i * 500));
                    }));
                }
                
                const results = await Promise.all(promises);
                $('#default-result').text('다중 요청 완료:\n' + results.join('\n'));
                
            } catch (error) {
                $('#default-result').text('오류: ' + error.message);
            }
        }
        
        // 2. 커스텀 로딩 함수 테스트
        async function testCustomLoading() {
            $('#custom-result').text('커스텀 로딩 시작...');
            
            // 커스텀 로딩 함수들
            const customLoading = function() {
                $('#custom-loading-indicator').fadeIn(300);
                console.log('커스텀 로딩 시작');
            };
            
            const customUnloading = function() {
                $('#custom-loading-indicator').fadeOut(300);
                console.log('커스텀 로딩 종료');
            };
            
            try {
                // 커스텀 로딩으로 요청 시뮬레이션
                customLoading();
                
                await new Promise(resolve => {
                    setTimeout(() => {
                        customUnloading();
                        resolve();
                    }, 2500);
                });
                
                $('#custom-result').text('커스텀 로딩 테스트 완료!\n오른쪽에 녹색 로딩 표시가 나타났다가 사라졌습니다.');
                
            } catch (error) {
                customUnloading();
                $('#custom-result').text('오류: ' + error.message);
            }
        }
        
        // 3. 로딩 비활성화 테스트
        async function testNoLoading() {
            $('#no-loading-result').text('로딩 없이 요청 중...');
            
            try {
                // 로딩 없이 요청 시뮬레이션
                await new Promise(resolve => {
                    setTimeout(resolve, 2000);
                });
                
                $('#no-loading-result').text('로딩 비활성화 테스트 완료!\n로딩 화면이 표시되지 않았습니다.');
                
            } catch (error) {
                $('#no-loading-result').text('오류: ' + error.message);
            }
        }
        
        // 4. 기존 JSP 코드 호환성 테스트
        async function testJspCompatibility() {
            $('#jsp-result').text('JSP 호환성 테스트 시작...');
            
            // 기존 JSP에서 사용하던 loading/unloading 함수 시뮬레이션
            window.loading = function() {
                $('#jsp-loading-status').text('JSP loading() 함수 호출됨');
                console.log('기존 JSP loading() 함수 실행');
            };
            
            window.unloading = function() {
                $('#jsp-loading-status').text('JSP unloading() 함수 호출됨');
                console.log('기존 JSP unloading() 함수 실행');
                
                setTimeout(() => {
                    $('#jsp-loading-status').text('');
                }, 2000);
            };
            
            try {
                // 기존 함수를 사용한 요청 시뮬레이션
                loading();
                
                await new Promise(resolve => {
                    setTimeout(() => {
                        unloading();
                        resolve();
                    }, 2000);
                });
                
                $('#jsp-result').text('JSP 호환성 테스트 완료!\n기존 loading/unloading 함수가 정상적으로 호출되었습니다.');
                
            } catch (error) {
                unloading();
                $('#jsp-result').text('오류: ' + error.message);
            }
        }
        
        // 실제 HTTP 요청 예제 (주석 처리)
        /*
        async function realApiExample() {
            try {
                // 기본 로딩 사용
                const response1 = await $.http.post('/api/test', { data: 'test' });
                
                // 커스텀 로딩 사용
                const response2 = await $.http.post('/api/test', { data: 'test' }, {
                    loading: customLoading,
                    unloading: customUnloading
                });
                
                // 로딩 비활성화
                const response3 = await $.http.post('/api/test', { data: 'test' }, {
                    showLoading: false
                });
                
                // 기존 함수 사용
                const response4 = await $.http.post('/api/test', { data: 'test' }, {
                    loading: window.loading,
                    unloading: window.unloading
                });
                
            } catch (error) {
                console.error('API 오류:', error);
            }
        }
        */
        
        $(document).ready(function() {
            console.log('HTTP Utility with Loading 테스트 페이지 로드됨');
            console.log('사용 가능한 메서드:', Object.keys($.http));
        });
    </script>
</body>
</html>
