<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>TabFormSync Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./TabFormSync.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #tabContainer { margin-bottom: 12px; }
        #formContainer { border: 1px solid #ddd; padding: 12px; border-radius: 6px; }
        .log { margin-top: 12px; background: #f8f9fa; padding: 10px; border-radius: 6px; max-height:200px; overflow:auto; }
    </style>
</head>
<body>
    <h2>TabFormSync - Enter/Shift+Enter 테스트</h2>
    <ul id="tabContainer"></ul>
    <div id="formContainer"></div>

    <div style="margin-top:12px">
        <button id="registerBtn">Register SEND handler for 2004</button>
        <button id="unregisterBtn">Unregister SEND handler for 2004</button>
    </div>

    <div class="log" id="log"></div>

    <script>
        function addLog(msg) {
            const $log = $('#log');
            $log.prepend(`<div>${new Date().toLocaleTimeString()} - ${msg}</div>`);
        }

        const tfs = new TabFormSync({ useLocalData: true, localMenuData: null });

        // fallback을 강제로 사용
        tfs.useFallback();
        tfs.createTabs();
        tfs.createForms();
        tfs.activateFirst();

        // 진단 로그: CSS 적용 여부, textarea 존재, 키 바인딩 확인
        setTimeout(() => {
            const styleExists = !!document.getElementById('tabFormSyncCSS');
            addLog('CSS tag present: ' + styleExists);

            const $ta = $('#form-2004').find('textarea');
            addLog('#form-2004 textarea count: ' + ($ta.length));

            if ($ta.length) {
                // 진단용 키 이벤트 리스너
                $ta.on('keydown.diagnostic', (e) => {
                    const key = e.key || e.keyCode || e.which;
                    addLog('diagnostic keydown -> key: ' + key + ', shiftKey: ' + !!e.shiftKey);
                });
            }

            // 자동 등록 (테스트 편의): SEND 핸들러 등록 및 로그
            const auto = tfs.registerSendHandler('2004', sendHandler);
            addLog('auto registerSendHandler(2004): ' + auto);
        }, 50);

        // 샘플 SEND 핸들러
        function sendHandler(values, meta) {
            addLog(`SEND handler called for menu ${meta.menuId}`);
            addLog(`rawText: "${meta.rawText}"`);
            addLog(`formValues: ${JSON.stringify(values)}`);
            // 예: 비동기 시뮬레이션
            return new Promise((resolve) => setTimeout(() => { addLog('Simulated send complete'); resolve(true); }, 600));
        }

        $('#registerBtn').on('click', () => {
            const ok = tfs.registerSendHandler('2004', sendHandler);
            addLog('registerSendHandler -> ' + ok);
        });

        $('#unregisterBtn').on('click', () => {
            const ok = tfs.unregisterSendHandler('2004');
            addLog('unregisterSendHandler -> ' + ok);
        });
    </script>
    </body>
</html>
